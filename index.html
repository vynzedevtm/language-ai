<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoAI Tutor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 18px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .title { font-weight: 700; font-size: 1rem; color: #38bdf8; }
    .badge { font-size: 0.75rem; background: #0f172a; padding: 4px 10px; border-radius: 999px; border: 1px solid #475569; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.45; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    .ai button.voice-btn { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; background: #0284c7; border: none; color: white; padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .ai button.voice-btn:hover { background: #0369a1; }
    #controls { padding: 12px 16px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155; }
    input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #475569; background: #0b0f19; color: #ffffff; outline: none; font-size: 0.95rem; }
    input:focus { border-color: #38bdf8; }
    button.send-btn { background: #059669; border: none; color: white; padding: 0 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button.send-btn:disabled { background: #475569; cursor: not-allowed; }
    #limit-banner { background: #be123c; color: white; text-align: center; padding: 6px; font-size: 0.8rem; font-weight: 600; display: none; }
  </style>
</head>
<body>

  <header>
    <div class="title">⚡ LingoAI Voice Tutor</div>
    <div class="badge" id="counter-badge">Voice: 5/5 Left</div>
  </header>

  <div id="limit-banner">Daily voice limit reached (5/5). Text chatting is unlimited!</div>

  <div id="chat-box">
    <div class="msg ai">
      Hey! Type or speak any sentence in English (even with errors), and I will fix it and reply!
    </div>
  </div>

  <div id="controls">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    // 1. PLACE YOUR CLOUDFLARE WORKER URL HERE:
    const WORKER_URL = "https://language-tutor-api.ashishkaji08.workers.dev/";

    const VOICE_LIMIT = 5;
    let voiceCount = parseInt(localStorage.getItem("dailyVoiceCount") || "0");
    updateBadge();

    function updateBadge() {
      const remaining = Math.max(0, VOICE_LIMIT - voiceCount);
      document.getElementById("counter-badge").innerText = `Voice: ${remaining}/${VOICE_LIMIT} Left`;
      if (remaining === 0) {
        document.getElementById("limit-banner").style.display = "block";
      }
    }

    function speakText(text) {
      if (voiceCount >= VOICE_LIMIT) {
        alert("Daily voice limit reached. Upgrade to Pro for unlimited native audio!");
        return;
      }

      window.speechSynthesis.cancel(); // Stop any pending speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);

      voiceCount++;
      localStorage.setItem("dailyVoiceCount", voiceCount);
      updateBadge();
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const btn = document.getElementById("sendBtn");
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, "user");
      input.value = "";
      btn.disabled = true;

      const aiMsgDiv = appendMsg("Thinking...", "ai");

      // 10-second timeout controller so it never hangs silently
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 25000);

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, targetLanguage: "English" }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const data = await res.json();
        const reply = data.reply || "No response received.";

        const cleanReplyForSpeech = reply.replace(/'/g, "\\'").replace(/\n/g, " ");
        aiMsgDiv.innerHTML = `${reply}<br><button class="voice-btn" onclick="speakText('${cleanReplyForSpeech}')">🔊 Pronounce</button>`;
        
        // Auto-speak if quota remains
        if (voiceCount < VOICE_LIMIT) {
          speakText(reply);
        }
      } catch (err) {
        clearTimeout(timeoutId);
        aiMsgDiv.innerText = err.name === "AbortError" 
          ? "Request timed out. Please check your Worker URL." 
          : `Connection Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    function appendMsg(text, sender) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    document.getElementById("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
